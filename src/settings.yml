---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
polling_url: '{{ proxyurl }}'
polling_headers: ''
polling_body: ''
custom_fields:
- keyname: about
  name: Plugin Starter
  field_type: author_bio
  category: travel,life
  description: Live Victorian metro train vehicle positions via a JSON proxy over the PTV GTFS Realtime feed
- keyname: proxyurl
  field_type: string
  name: JSON Proxy URL
  description: URL of either the local proxy or a published raw GitHub JSON snapshot generated by GitHub Actions
  placeholder: https://raw.githubusercontent.com/your-user/your-repo/data/ptv-metro.json
  help_text: Required because the PTV feed is protobuf, not JSON
- keyname: stopid
  field_type: string
  name: PTV Stop ID
  description: Optional stop filter using the scheduled GTFS stop_id matched from the live train trip
  placeholder: '11221'
  optional: true
  help_text: Leave blank to show all stops from the feed
- keyname: routeid
  field_type: string
  name: PTV Route ID
  description: Optional route filter using vehicle.trip.route_id
  placeholder: '1'
  optional: true
  help_text: Leave blank to show all routes from the feed
- keyname: stalemins
  field_type: number
  placeholder: 10
  default: 10
  name: Hide Stale Updates After
  description: Hide vehicles whose position timestamp is older than this number of minutes
  min: 1
  max: 120
  help_text: Min 1, Max 120 mins
name: Victoria Metro Train Status (PTV)
refresh_interval: 1
