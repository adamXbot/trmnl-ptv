---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
polling_url: '{{ proxyurl }}'
polling_headers: ''
polling_body: ''
custom_fields:
- keyname: about
  name: Plugin Starter
  field_type: author_bio
  category: travel,life
  description: Live Victorian metro train vehicle positions via a JSON proxy over the PTV GTFS Realtime feed
- keyname: proxyurl
  field_type: string
  name: JSON Proxy URL
  description: URL of either the local proxy or a published raw GitHub JSON snapshot generated by GitHub Actions
  placeholder: https://raw.githubusercontent.com/your-user/your-repo/data/ptv-metro.json
  help_text: Required because the PTV feed is protobuf, not JSON
- keyname: stopid
  field_type: string
  name: Filter Stop ID
  description: Optional filter entered in the plugin settings screen. Use a platform stop ID like 12236, or a station group ID like vic:rail:RWD.
  placeholder: '12236'
  optional: true
  help_text: Add this in the plugin custom fields. Leave blank to show all trains. Use the published stop finder page to look up IDs.
- keyname: routeid
  field_type: string
  name: Filter Route ID
  description: Optional filter entered in the plugin settings screen using the exact live GTFS route_id value from the feed.
  placeholder: Leave blank unless needed
  optional: true
  help_text: Add this in the plugin custom fields. Leave blank to show all routes.
- keyname: stalemins
  field_type: number
  placeholder: 20
  default: 20
  name: Hide Stale Updates After
  description: Hide vehicles whose position timestamp is older than this number of minutes
  min: 1
  max: 120
  help_text: Use 20+ for GitHub Actions mode because off-peak snapshots update every 15 minutes
name: Victoria Metro Train Status (PTV)
refresh_interval: 1
